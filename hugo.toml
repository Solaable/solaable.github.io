baseURL = "https://solaable.github.io/"
languageCode = "zh-cn"
title = "Skyrim's blog"
theme = "github-style"
pygmentsCodeFences = true
pygmentsUseClasses = true
lastmod = true

[params]
  author = "Skyrim"
  description = "不 须 放 屁 ！试 看 天 地 翻 覆 。"
  github = "Solaable"
  email = "2251318580@qq.com"
  url = "https://solaable.github.io/"
  keywords = "blog, google analytics"
  rss = true
  lastmod = true
  favicon = "/images/github-mark.png"
  avatar = "/images/avatar.png"
  headerIcon = "/images/github-mark-white.png"
  location = "China"
  userStatusEmoji = "😀"
  enableGitalk = true
  enableSearch = true

  [params.gitalk]
    clientID = "Your client ID" # Your client ID
    clientSecret = "Your client secret" # Your client secret
    repo = "solaable.github.io" # 您的博客的github地址Repository name，例如：xxxx.github.io
    owner = "solaable" # 您的GitHub ID
    admin = "solaable" # 您的GitHub ID
    id = "location.pathname" # 文章页面的链接地址就是ID
    labels = "gitalk" # Github issue labels. If you used to use Gitment, you can change it
    perPage = 15 # Pagination size, with maximum 100.
    pagerDirection = "last" # Comment sorting direction, available values are 'last' and 'first'.
    createIssueManually = true # 设置为true，如果是管理员登录，会自动创建issue，如果是false，需要管理员手动添加第一个评论(issue)
    distractionFreeMode = false # Enable hot key (cmd|ctrl + enter) submit comment.
    proxy = "https://cors-anywhere.azm.workers.dev/https://github.com/login/oauth/access_token" # 可以自行添加反向代理
  [[params.links]]
    title = "Link"
    href = "https://github.com/SkyrimIIII"
  [[params.links]]
    title = "Link2"
    href = "https://SkyrimIIII.com"
    icon = "/images/avatar.png"

[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[services]
  [services.googleAnalytics]
    ID = "UA-123456-789"
[outputs]
  home = ["html", "json"]

[outputFormats.json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = false
<!-- GitHub 风格浮动聊天窗 v4 - 复用主题 CSS 变量 -->
<style>
  /* 如果主题没有定义某个变量，fallback 到 GitHub Primer 默认值 */
  #rag-chat-widget {
    --chat-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: var(--chat-font);
    line-height: 1.5;
  }

  /* 触发按钮 - 使用主题按钮样式 */
  #rag-chat-toggle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--color-bg-secondary, #f6f8fa);
    color: var(--color-text-primary, #24292f);
    border: 1px solid var(--color-border-primary, #d0d7de);
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(27,31,36,0.04), 0 1px 3px rgba(27,31,36,0.15);
    transition: background-color 80ms cubic-bezier(0.33, 1, 0.68, 1), box-shadow 80ms cubic-bezier(0.33, 1, 0.68, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
  }

  #rag-chat-toggle:hover {
    background: var(--color-bg-secondary, #eef1f4);
    box-shadow: 0 1px 0 rgba(27,31,36,0.1), 0 1px 6px rgba(27,31,36,0.2);
  }

  #rag-chat-toggle:active {
    background: var(--color-bg-secondary, #e2e5e9);
    box-shadow: inset 0 1px 0 rgba(27,31,36,0.15);
  }

  /* 聊天窗口 */
  #rag-chat-window {
    display: none;
    position: absolute;
    bottom: 72px;
    right: 0;
    width: 380px;
    max-width: 90vw;
    height: 520px;
    max-height: 75vh;
    background: var(--color-bg-secondary, #ffffff);
    border: 1px solid var(--color-border-primary, #d0d7de);
    border-radius: 12px;
    box-shadow: 0 0 0 1px var(--color-border-primary, #d0d7de), 0 8px 16px -4px rgba(31,35,40,0.1), 0 4px 32px -4px rgba(31,35,40,0.1), 0 24px 48px -12px rgba(31,35,40,0.1), 0 48px 96px -24px rgba(31,35,40,0.1);
    flex-direction: column;
    overflow: hidden;
    animation: chat-slide-up 0.12s ease-out;
  }

  @keyframes chat-slide-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 头部 */
  .rag-chat-header {
    background: var(--color-header-bg, #f6f8fa);
    color: var(--color-text-primary, #24292f);
    padding: 10px 16px;
    border-bottom: 1px solid var(--color-border-primary, #d0d7de);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 14px;
  }

  .rag-chat-close {
    cursor: pointer;
    font-size: 18px;
    color: var(--color-text-primary, #656d76);
    transition: color 80ms ease;
    line-height: 1;
  }

  .rag-chat-close:hover {
    color: var(--color-text-primary, #24292f);
  }

  /* 消息区 */
  .rag-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--color-bg-secondary, #ffffff);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rag-message {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    word-break: break-word;
    animation: msg-fade-in 0.15s ease;
  }

  @keyframes msg-fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .rag-message.user { align-self: flex-end; }
  .rag-message.bot { align-self: flex-start; }

  .rag-bubble {
    padding: 8px 12px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
  }

  .rag-message.user .rag-bubble {
    background: var(--color-accent-emphasis, #0969da);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .rag-message.bot .rag-bubble {
    background: var(--color-bg-tertiary, #f6f8fa);
    color: var(--color-text-primary, #24292f);
    border: 1px solid var(--color-border-primary, #d0d7de);
    border-bottom-left-radius: 4px;
  }

  .rag-thinking {
    color: var(--color-text-secondary, #656d76);
    font-size: 12px;
    padding: 4px 8px;
    align-self: flex-start;
  }

  /* 输入区 */
  .rag-chat-input-area {
    display: flex;
    padding: 12px;
    border-top: 1px solid var(--color-border-primary, #d0d7de);
    background: var(--color-bg-secondary, #ffffff);
    gap: 8px;
    align-items: center;
  }

  .rag-chat-input {
    flex: 1;
    padding: 5px 12px;
    border: 1px solid var(--color-border-primary, #d0d7de);
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    line-height: 20px;
    background: var(--color-header-search-bg, #f6f8fa);
    color: var(--color-text-primary, #24292f);
    transition: border-color 80ms ease, box-shadow 80ms ease;
    font-family: var(--chat-font);
  }

  .rag-chat-input:focus {
    border-color: var(--color-state-focus-border, #0969da);
    box-shadow: 0 0 0 2px rgba(9,105,218,0.3);
  }

  /* 发送按钮 - 完全遵循 GitHub 按钮 */
  .rag-chat-send {
    padding: 5px 16px;
    background: var(--color-bg-secondary, #f6f8fa);
    color: var(--color-text-primary, #24292f);
    border: 1px solid var(--color-border-primary, #d0d7de);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    transition: background-color 80ms cubic-bezier(0.33,1,0.68,1), box-shadow 80ms cubic-bezier(0.33,1,0.68,1);
    white-space: nowrap;
    font-family: var(--chat-font);
    outline: none;
  }

  .rag-chat-send:hover {
    background: var(--color-bg-secondary, #eef1f4);
  }

  .rag-chat-send:active {
    background: var(--color-bg-secondary, #e2e5e9);
    box-shadow: inset 0 1px 0 rgba(27,31,36,0.15);
  }

  .rag-chat-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* 滚动条 */
  .rag-chat-messages::-webkit-scrollbar { width: 6px; }
  .rag-chat-messages::-webkit-scrollbar-track { background: transparent; }
  .rag-chat-messages::-webkit-scrollbar-thumb {
    background: var(--color-border-primary, #d0d7de);
    border-radius: 3px;
  }
  .rag-chat-messages::-webkit-scrollbar-thumb:hover {
    background: var(--color-text-secondary, #8b949e);
  }
</style>

<!-- HTML 结构不变，和之前一样 -->
<div id="rag-chat-widget">
  <button id="rag-chat-toggle" title="打开博客助手" aria-label="打开博客助手">💬</button>
  <div id="rag-chat-window" role="dialog" aria-label="博客助手聊天窗口">
    <div class="rag-chat-header">
      <span>💬 博客助手</span>
      <span class="rag-chat-close" id="rag-chat-close" title="关闭">✕</span>
    </div>
    <div class="rag-chat-messages" id="rag-chat-messages">
      <div class="rag-message bot">
        <div class="rag-bubble">你好！我是基于博客文章的问答助手，有什么可以帮你的？</div>
      </div>
    </div>
    <div class="rag-chat-input-area">
      <input type="text" class="rag-chat-input" id="rag-chat-input" placeholder="输入你的问题..." autocomplete="off" />
      <button class="rag-chat-send" id="rag-chat-send">发送</button>
    </div>
  </div>
</div>



<script>
(function() {
  // ---------- 配置你的 RAG API 地址 ----------
  const API_URL = 'http://127.0.0.1:5000/ask';

  const toggleBtn = document.getElementById('rag-chat-toggle');
  const chatWindow = document.getElementById('rag-chat-window');
  const closeBtn = document.getElementById('rag-chat-close');
  const messagesDiv = document.getElementById('rag-chat-messages');
  const inputField = document.getElementById('rag-chat-input');
  const sendBtn = document.getElementById('rag-chat-send');

  function openChat() {
    chatWindow.style.display = 'flex';
    toggleBtn.textContent = '✕';
    inputField.focus();
  }

  function closeChat() {
    chatWindow.style.display = 'none';
    toggleBtn.textContent = '💬';
  }

  toggleBtn.addEventListener('click', () => {
    if (chatWindow.style.display === 'flex') {
      closeChat();
    } else {
      openChat();
    }
  });

  closeBtn.addEventListener('click', closeChat);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && chatWindow.style.display === 'flex') {
      closeChat();
    }
  });

  function addMessage(text, sender = 'bot') {
    const msgDiv = document.createElement('div');
    msgDiv.className = `rag-message ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'rag-bubble';
    bubble.textContent = text;
    msgDiv.appendChild(bubble);
    messagesDiv.appendChild(msgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendQuestion() {
    const question = inputField.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    inputField.value = '';
    sendBtn.disabled = true;
    inputField.disabled = true;

    const thinkingDiv = document.createElement('div');
    thinkingDiv.className = 'rag-thinking';
    thinkingDiv.textContent = '思考中...';
    messagesDiv.appendChild(thinkingDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      thinkingDiv.remove();

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();
      const answer = data.answer || data.response || data.result || '抱歉，我暂时无法回答这个问题。';
      addMessage(answer, 'bot');
    } catch (error) {
      thinkingDiv.remove();
      addMessage('请求失败，请稍后再试。', 'bot');
      console.error('RAG API error:', error);
    } finally {
      sendBtn.disabled = false;
      inputField.disabled = false;
      inputField.focus();
    }
  }

  sendBtn.addEventListener('click', sendQuestion);
  inputField.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendQuestion();
  });

  // 初始隐藏
  chatWindow.style.display = 'none';
})();
</script>
